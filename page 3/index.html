<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Form Fitness</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
        <nav class="container site-nav" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="Form Fitness home"><span class="brand-mark" aria-hidden="true">f.</span> FORM <span class="brand-subtitle">FITNESS</span></a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../page 2/index.html">Info</a></li>
                <li><a href="../page 3/index.html" aria-current="page">Nutrition</a></li>
                <li><a href="../page 4/index.html">Plan</a></li>
                <li><a href="../page 5/index.html">Handbook</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <section id="nutrition" class="nutrition-section">
            <h1 class="text-center mb-3">Nutrition</h1>
            <p class="text-center mb-4">Tell us a bit about yourself and your goal.</p>

            <form action="#" method="get" class="nutrition-form">
                <fieldset>
                    <legend class="visually-hidden">Nutrition information</legend>

                    <div class="mb-3">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" name="gender" class="form-select" required>
                            <option value="" selected disabled>Choose one</option>
                            <option value="female">Female</option>
                            <option value="male">Male</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="weight" class="form-label">Weight (kg)</label>
                        <input type="number" id="weight" name="weight" class="form-control" min="30" max="300" required>
                    </div>

                    <div class="mb-3">
                        <label for="height" class="form-label">Height (cm)</label>
                        <input type="number" id="height" name="height" class="form-control" min="100" max="250" required>
                    </div>

                    <div class="mb-3">
                        <label for="goal" class="form-label">Goal / additional information</label>
                        <textarea id="goal" name="goal" class="form-control" rows="4" placeholder="For example: lose weight, build muscle..."></textarea>
                    </div>

                    <button type="submit" class="btn submit-button">Submit</button>
                </fieldset>
            </form>
        </section>
    </main>

    </body>
</html>
